# The only dual-homed piece of the demo: a dumb TCP forwarder between the
# host and the internal network. Resolves per-connection so restarted
# services keep working.
events {}
stream {
  resolver 127.0.0.11 valid=5s;
  map $server_port $backend {
    8080 cairn:8080;
    8081 gatus:8080;
    8082 whoami:80;
    8083 welcome:80;
    8085 podinfo:9898;
  }
  server {
    listen 8080;
    listen 8081;
    listen 8082;
    listen 8083;
    listen 8085;
    proxy_pass $backend;
  }
}
