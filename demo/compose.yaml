name: cairn-demo

# Everything lives on an internal network with no route to the outside;
# only the gateway, a dumb TCP forwarder, also touches the host side.
networks:
  demo:
    internal: true
  edge:

services:
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:8081:8081
      - 127.0.0.1:8082:8082
      - 127.0.0.1:8083:8083
      - 127.0.0.1:8084:8084
      - 127.0.0.1:8085:8085
    networks:
      - demo
      - edge
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  cairn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config:/config:ro
    networks:
      - demo
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gatus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "/cairn", "-healthcheck"]
      interval: 30s
      start_period: 5s

  gatus:
    image: twinproduction/gatus:latest
    volumes:
      - ./gatus:/config:ro
    networks:
      - demo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  whoami:
    image: traefik/whoami
    networks:
      - demo
    cap_drop:
      - ALL

  welcome:
    image: nginx:alpine
    networks:
      - demo

  httpd:
    image: httpd:alpine
    networks:
      - demo

  podinfo:
    image: stefanprodan/podinfo
    networks:
      - demo
    cap_drop:
      - ALL

  # "ghost" has no container on purpose: cairn lists it on localhost:8086,
  # gatus finds it down, the card shows the red dot.
