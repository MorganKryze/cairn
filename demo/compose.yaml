name: cairn-demo

# Everything lives on an internal network with no route to the outside;
# only the gateway, a dumb TCP forwarder, also touches the host side.
# None of these images comes from Docker Hub: anonymous pulls there share a
# rate limit across the whole CI runner pool, which failed this stack twice in
# one day. The three project images are their maintainers' own ghcr.io builds;
# nginx and httpd exist only on Docker Hub, so they come through Google's
# public mirror, which needs no account. The cairn service below is built from
# docker/Dockerfile, whose base image reads through that same mirror, so this
# whole stack now comes up without one anonymous Hub pull.
networks:
  demo:
    internal: true
  edge:

services:
  gateway:
    image: mirror.gcr.io/library/nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:8081:8081
      - 127.0.0.1:8082:8082
      - 127.0.0.1:8083:8083
      - 127.0.0.1:8084:8084
      - 127.0.0.1:8085:8085
    networks:
      - demo
      - edge
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  cairn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config:/config:ro
      # The icons are served from here, not from a CDN: the demo page makes
      # zero third-party requests, which is the claim it exists to prove.
      # Refresh them with: cairn -config demo/config -emit-icons
      - ./assets:/assets:ro
    networks:
      - demo
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gatus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "/cairn", "-healthcheck"]
      interval: 30s
      start_period: 5s

  gatus:
    image: ghcr.io/twin/gatus:latest
    volumes:
      - ./gatus:/config:ro
    networks:
      - demo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  whoami:
    image: ghcr.io/traefik/whoami
    networks:
      - demo
    cap_drop:
      - ALL

  welcome:
    image: mirror.gcr.io/library/nginx:alpine
    networks:
      - demo

  httpd:
    image: mirror.gcr.io/library/httpd:alpine
    networks:
      - demo

  podinfo:
    image: ghcr.io/stefanprodan/podinfo
    networks:
      - demo
    cap_drop:
      - ALL

  # "ghost" has no container on purpose: cairn lists it on localhost:8086,
  # gatus finds it down, the card shows the red dot.
