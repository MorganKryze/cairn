    }
  tags: [gatus, status, monitoring]
  selfhosted: false

- id: old-forum
  url: https://forum.example.org
  category: links
  state: retired
  icon: discourse
  name: { fr: Ancien forum, en: Old forum }
  desc:
    {
      fr: "Remplacé par les discussions sur le dépôt.",
      en: "Replaced by the discussions on the repository.",
    }
  details:
    fr: |
      Ce forum a fermé. Son adresse est toujours dans le fichier de config,
      juste au-dessus de cette ligne : retirer un service se fait en ajoutant
      `state: retired`, jamais en supprimant quoi que ce soit. cairn cesse de
      la lier et la garde.

      Cette page reste servie, et c'est tout son intérêt : c'est le seul
      endroit où dire vers quoi aller à la place.
    en: |
      This forum closed. Its address is still in the config file, right above
      this line: retiring a service is adding `state: retired`, never deleting
      anything. cairn stops linking it and keeps it.

      This page is still served, and that is the whole point: it is the only
      place left to say where to go instead.
  tags: [forum, discussion, archive]
  selfhosted: false
