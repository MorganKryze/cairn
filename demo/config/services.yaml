# yaml-language-server: $schema=https://raw.githubusercontent.com/MorganKryze/cairn/main/schema/services.json
# The URLs are what the *visitor's browser* opens (published on 127.0.0.1);
# gatus/config.yaml probes the same services through the compose network.

- id: welcome
  url: http://localhost:8083
  category: pages
  icon: nginx
  name: { fr: Page nginx, en: nginx page }
  desc:
    {
      fr: La page de bienvenue du serveur web nginx.,
      en: The nginx web server welcome page.,
    }
  details:
    fr: |
      nginx est le serveur web qui sert cette page, et l'un des plus répandus
      du web. Chez la plupart des gens qui s'auto-hébergent, il tient aussi la
      porte : il reçoit les requêtes et les distribue aux services derrière
      lui. Ici il n'en fait que la première moitié, et affiche sa page par
      défaut.
    en: |
      nginx is the web server behind this page, and one of the most widely used
      on the web. For most people who self-host it also keeps the door: it
      takes the requests and hands them to the services behind it. Here it does
      only the first half of that, and shows its default page.
  tags: [nginx, web]
  selfhosted: true

- id: httpd
  url: http://localhost:8084
  category: pages
  icon: apache
  name: { fr: Page Apache, en: Apache page }
  desc:
    {
      fr: La page de bienvenue du serveur web Apache.,
      en: The Apache web server welcome page.,
    }
  tags: [apache, web]
  selfhosted: true

- id: caddy
  category: pages
  state: soon
  icon: caddy
  name: { fr: Page Caddy, en: Caddy page }
  desc:
    {
      fr: "Le troisième serveur web, pas encore déployé.",
      en: "The third web server, not deployed yet.",
    }
  details:
    fr: |
      Cette carte n'a pas de `url` du tout, et cairn n'en demande pas pour un
      service annoncé : il n'y a rien à lier tant qu'il n'existe pas. La carte
      n'est donc pas un lien, elle sort du parcours au clavier, et elle
      s'atténue pour dire de passer son chemin. Aucun conteneur ne tourne
      derrière, et aucun endpoint Gatus ne la surveille.

      Cette page-ci fonctionne : c'est l'endroit où raconter ce qui arrive.
    en: |
      This card has no `url` at all, and cairn asks for none on a service that
      is announced: there is nothing to link until it exists. So the card is
      not a link, it leaves the keyboard path, and it dims to say walk past.
      No container runs behind it and no Gatus endpoint watches it.

      This page still works: it is where you say what is coming.
  tags: [web, serveur, server]
  selfhosted: true

- id: whoami
  url: http://localhost:8082
  category: tools
  # Decorative: the link works, Gatus still watches it, and the pill still
  # reports. The badge only warns. This is the pair the docs draw a line
  # between: the state is declared, the status is measured.
  state: beta
  icon: traefik
  name: { fr: "Qui suis-je ?", en: "Who am I?" }
  desc:
    {
      fr: Affiche ce que le serveur voit de votre requête.,
      en: Shows what the server sees in your request.,
    }
  details:
    fr: |
      Ouvrez la page et vous verrez votre requête telle que le serveur la
      reçoit : adresse, en-têtes, protocole. Pratique pour comprendre ce
      qu'un site sait de vous, ou pour vérifier qu'un proxy fait son travail.
    en: |
      Open the page and you see your request as the server receives it:
      address, headers, protocol. Handy to understand what a site knows
      about you, or to check that a proxy does its job.
  images:
    - src: whoami.png
      caption:
        fr: La réponse de whoami au navigateur sans tête qui a pris cette capture.
        en: whoami answering the headless browser that took this screenshot.
  tags: [echo, debug, requête, request]
  selfhosted: true

- id: podinfo
  icon: go
  url: http://localhost:8085
  category: tools
  name: { fr: Podinfo, en: Podinfo }
  desc:
    {
      fr: Une petite application de démonstration qui dit bonjour.,
      en: A tiny demo application that says hello.,
    }
  details:
    fr: |
      Une application témoin : elle affiche sa version, le nom du conteneur
      qui répond et un bouton pour la solliciter. C'est aussi la carte qui
      montre les images de preview : le fichier vit dans config/media/ et la
      page le sert elle-même.
    en: |
      A specimen application: it shows its version, the name of the answering
      container and a button to poke it. It is also the card that shows off
      preview images: the file lives in config/media/ and the page serves it
      itself.
  images:
    - src: podinfo.png
      caption:
        fr: La page d'accueil de podinfo, capturée depuis cette démo.
        en: The podinfo home page, captured from this very demo.
  tags: [demo, go]
  selfhosted: true

- id: ghost
  icon: docker
  state: deprecated
  url: http://localhost:8086
  category: tools
  name: { fr: Service fantôme, en: Ghost service }
  desc:
    {
      fr: "Volontairement éteint, pour montrer la pastille rouge.",
      en: "Intentionally down, to show the red dot.",
    }
  details:
    fr: |
      Ce service n'existe pas : aucun conteneur n'écoute derrière. Gatus le
      constate et cairn affiche la pastille rouge : c'est exactement ce que
      verraient vos visiteurs si un vrai service tombait.

      Son badge est décoratif, comme `beta` et `new` : le lien fonctionne
      toujours, Gatus continue de le surveiller et la pastille continue de
      dire ce qu'elle mesure. Seuls `soon` et `retired` retirent le lien.
    en: |
      This service does not exist: no container listens behind it. Gatus
      notices and cairn shows the red dot: exactly what your visitors would
      see if a real service went down.

      Its badge is decorative, like `beta` and `new`: the link still works,
      Gatus still watches it, and the pill still reports what it measures.
      Only `soon` and `retired` take the link away.
  tags: [status, down, panne]
  selfhosted: true

# The three below are external references: no container, no Gatus endpoint,
# just links out. Note how cards without monitoring simply show no status pill.

