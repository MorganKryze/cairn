# yaml-language-server: $schema=https://raw.githubusercontent.com/MorganKryze/cairn/main/schema/site.json
title: cairn demo
tagline:
  fr: Un annuaire d'exemple, adossé à de vrais services et un vrai Gatus.
  en: A sample directory backed by real services and a real Gatus.
logo: /static/favicon.svg           # your own image goes in /assets (see docs)
locales: [fr, en]
status:
  gatus: http://gatus:8080        # cairn polls this over the compose network
  page: http://localhost:8081     # the pill links visitors to the published port
  interval: 10s
about:
  fr: |
    Bienvenue ! Vous êtes sur l'annuaire d'exemple de cairn : de vrais
    conteneurs, un vrai Gatus, et cette page pour les présenter. Sur votre
    déploiement, ce bloc raconte votre histoire : qui vous êtes, ce que vous
    hébergez, comment vous joindre.

    Il se referme avec le bouton en haut à droite ; le choix est retenu un an.
  en: |
    Welcome! You are on cairn's sample directory: real containers, a real
    Gatus, and this page to present them. On your deployment, this block
    tells your story: who you are, what you host, how to reach you.

    It closes with the button in the top-right corner; the choice is
    remembered for a year.
links:
  - label: { fr: Documentation, en: Documentation }
    url: https://github.com/MorganKryze/cairn/tree/main/docs
    icon: book
  - label: { fr: Code source, en: Source code }
    url: https://github.com/MorganKryze/cairn
    icon: github
  - label: { fr: Statut, en: Status }
    url: http://localhost:8081
    icon: status
  - label: { fr: Me contacter, en: Get in touch }
    url: mailto:contact@exemple.org
    icon: mail
  - label: { fr: Faire un don, en: Donate }
    url: https://ko-fi.com/morgankryze
    icon: heart
footer:
  - label: { fr: Statut des services (Gatus), en: Service status (Gatus) }
    url: http://localhost:8081
pages:
  - id: mentions-legales
    title: { fr: Mentions légales, en: Legal notice }
    body:
      fr: >
        Cette page est un modèle : sur votre déploiement, remplacez chaque
        rubrique par vos informations réelles.
      en: >
        This page is a template: on your own deployment, replace each
        section with your real information.
    sections:
      - title: { fr: Éditeur, en: Publisher }
        body:
          fr: >
            Ce site est édité par **Prénom Nom**, à titre personnel et non
            commercial. Contact :
            [contact@exemple.org](mailto:contact@exemple.org).
          en: >
            This site is published by **First Last**, in a personal,
            non-commercial capacity. Contact:
            [contact@example.org](mailto:contact@example.org).
      - title: { fr: Directeur de la publication, en: Publishing director }
        body:
          fr: "Prénom Nom, en qualité d'éditeur du site."
          en: "First Last, as publisher of the site."
      - title: { fr: Hébergement, en: Hosting }
        body:
          fr: >
            Ce site est auto-hébergé par son éditeur, sur une machine qu'il
            administre lui-même. Dans le cas de cette démo, il tourne dans
            un conteneur Docker sur la machine qui affiche cette page.
          en: >
            This site is self-hosted by its publisher, on a machine they
            administer themselves. In the case of this demo, it runs in a
            Docker container on the machine displaying this page.
      - title: { fr: Propriété intellectuelle, en: Intellectual property }
        body:
          fr: >
            Les noms et logos des services listés appartiennent à leurs
            projets respectifs. Le reste du contenu de ce site est publié
            sous la responsabilité de l'éditeur.
          en: >
            The names and logos of the listed services belong to their
            respective projects. The rest of this site's content is
            published under the publisher's responsibility.
  - id: confidentialite
    title: { fr: Confidentialité, en: Privacy }
    sections:
      - title: { fr: Données collectées, en: Data we collect }
        body:
          fr: >
            Aucune. Ce site ne collecte, ne stocke ni ne transmet aucune
            donnée personnelle. Il n'utilise ni mesure d'audience, ni
            traceur, et ne tient aucun journal de visite.
          en: >
            None. This site collects, stores and transmits no personal
            data. It uses no analytics, no trackers, and keeps no visit
            logs.
      - title: { fr: Cookies, en: Cookies }
        body:
          fr: >
            Deux cookies au plus, strictement fonctionnels : `locale`
            mémorise la langue choisie via le sélecteur, `about` retient la
            fermeture du message d'accueil. Chacun dure un an, est exempté
            de consentement et n'est lu par personne d'autre que ce site.
          en: >
            At most two cookies, strictly functional: `locale` remembers the
            language picked with the switcher, `about` remembers that you
            closed the welcome note. Each lasts one year, is exempt from
            consent and is read by no one but this site.
      - title: { fr: Services tiers, en: Third parties }
        body:
          fr: >
            Les icônes des services proviennent du CDN jsdelivr.net :
            votre navigateur lui adresse une requête au chargement de la
            page, ce qui lui révèle votre adresse IP. Pour un site sans
            aucun tiers, l'éditeur peut
            [héberger ses propres icônes](https://github.com/MorganKryze/cairn/blob/main/docs/recipes/icons.md).
          en: >
            Service icons come from the jsdelivr.net CDN: your browser
            sends it a request when the page loads, which reveals your IP
            address to it. For a site with no third parties at all, the
            publisher can
            [host their own icons](https://github.com/MorganKryze/cairn/blob/main/docs/recipes/icons.md).
      - title: { fr: Vos droits, en: Your rights }
        body:
          fr: >
            Pour toute question relative à vos données, écrivez à
            l'éditeur à l'adresse indiquée dans les mentions légales.
          en: >
            For any question about your data, write to the publisher at
            the address given in the legal notice.
