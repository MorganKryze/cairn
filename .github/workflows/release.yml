name: release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege by default; each job asks for what it writes.
permissions:
  contents: read

# One release at a time. Not keyed on the ref, unlike build.yml: the resource
# two runs contend for is `stable`, which every release writes and no ref
# distinguishes, so the group has to be the workflow itself. Cancelling is
# wrong here too, hence cancel-in-progress: false. A release killed halfway
# leaves published artifacts behind with nothing pointing at them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the tarballs to the release
      id-token: write # signs the provenance attestation, keylessly
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Build the release binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$version" -o cairn ./src/cmd/cairn
            tar -czf "cairn_${version}_${os}_${arch}.tar.gz" cairn
          done
          sha256sum cairn_*.tar.gz > checksums.txt

      # Says which workflow, at which commit, produced these exact bytes.
      # Verify with: gh attestation verify cairn_… --repo MorganKryze/cairn
      #
      # Before the upload, not after. An attestation is keyed by the file's
      # own digest and lives in GitHub's attestation store, not on the release,
      # so it can be made while the tarballs are still local files. Attaching
      # first would mean a failure here left downloadable tarballs that
      # `gh attestation verify` answers "no attestation" for, which reads as
      # tampering rather than as a broken workflow.
      #
      # checksums.txt is a subject too: it is published next to the tarballs
      # and people trust it the same way, so it needs the same proof.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            cairn_*.tar.gz
            checksums.txt

      - name: Attach the tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cairn_*.tar.gz checksums.txt --clobber


  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the versioned tags to ghcr.io
      id-token: write # cosign signs keylessly against this workflow identity
    # What the `hub` job copies. The tag rules live here and only here: a
    # second registry that recomputed them would be a list to keep in step.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      floating: ${{ steps.promote.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # buildx pulls its own builder image, and the default comes from Docker
      # Hub, where an anonymous pull shares one rate limit with every other
      # GitHub-hosted runner. It does not fail by saying so, it times out: this
      # step is exactly where the image job of the build on main died after
      # 1.13.2 shipped. Same mirror the base image and the demo already read
      # through, and the same object behind it, checked rather than assumed.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # Pinned like every action above. This one executes during the
          # build with the context in reach, and it was the last moving
          # tag in the chain. The digest is the same on Docker Hub and on
          # the mirror, so it does not tie us to either.
          #
          # Dependabot cannot watch an image named inside a workflow
          # (dependabot-core#5541), so a pin here would rot in silence.
          # The buildkit-pin job in security.yml is what stops that: it
          # runs weekly and says when buildx-stable-1 has moved past it.
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec # buildx-stable-1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish immutable, prove, then promote.
      #
      # Signing before publishing does not exist for OCI: a cosign signature is
      # itself an object in the registry, alongside the digest it covers, so
      # there has to be something to sign. Deleting a bad push afterwards is
      # the other obvious answer and it is worse: GITHUB_TOKEN carries no
      # delete scope for packages, and it races whoever already pulled.
      #
      # What can be ordered is the part that hurts. `stable` and `latest` are
      # the tags SECURITY.md tells people to verify, and they are the only ones
      # a failure here can leave pointing somewhere new and unsigned. So they
      # are not in this list: they are moved further down, onto a digest whose
      # signature has already been checked. A version tag that fails signing is
      # a version nobody has been sent to yet, and re-running the tag
      # republishes and signs the same content.
      #
      # A release candidate publishes its own exact version and moves nothing:
      # `v1.3.0-rc1` matches the `v*.*.*` trigger, and `1.3` and `1` float the
      # same way `stable` does. The hyphen is what makes a semver version a
      # prerelease, so it is what the guards test. The action declines to float
      # `{{major}}` and `{{major}}.{{minor}}` for a prerelease by itself; the
      # guards say so here anyway, so the rule is readable in the tag list
      # rather than inherited from an action's semantics.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Without this the action adds `latest` to the push by itself, which
          # is exactly the tag that must not move before the proof.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref, 'refs/tags/v0.') }}

      # vet + tests run inside the Dockerfile, so they gate the push.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # SLSA provenance and a software bill of materials, both attached to
          # the image so a puller can see how it was built and what is inside.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless: the signature is bound to this workflow's identity, no key to
      # store or rotate. One signature covers the digest, whatever tags point
      # at it.
      - name: sign the image and prove the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # The image name comes out of the metadata action rather than out of
          # github.repository: ghcr refuses the capital M in the owner, and the
          # action has already lowercased it.
          image=$(printf '%s\n' "$TAGS" | head -n1)
          image="${image%%:*}"
          cosign sign --yes "${image}@${DIGEST}"

          # The command SECURITY.md hands the reader, run against what was just
          # signed. `cosign sign` exiting 0 is not proof that anyone else can
          # verify the result, and nothing below promotes a tag on the strength
          # of an exit code alone.
          cosign verify "${image}@${DIGEST}" \
            --certificate-identity-regexp '^https://github.com/MorganKryze/cairn/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Retagging is a registry-side copy of the very index that was verified
      # above, so the digest does not change and `stable` cannot exist
      # unsigned. The equality check is not ceremony: if a future buildx ever
      # rebuilds the index instead of copying it, the tag would point at an
      # unsigned digest, and this is what would catch it.
      - name: move stable and latest onto the verified digest
        id: promote
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in stable latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
            moved=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${tag}")
            [ "$moved" = "$DIGEST" ] || {
              echo "::error::${tag} points at ${moved}, not the signed ${DIGEST}"
              exit 1
            }
          done
          # Written from inside the loop's own step rather than restated below,
          # so a prerelease, which skips this step, hands the `hub` job an
          # empty string and floats nothing there either.
          echo "tags=${IMAGE}:stable ${IMAGE}:latest" >> "$GITHUB_OUTPUT"


  # Docker Hub, from the digest ghcr has already published, signed and proved.
  #
  # A copy, not a second push target. Naming docker.io in the build's own tag
  # list is one line shorter and it puts Hub on the critical path of every
  # release: this is the registry cairn stopped pulling from after 1.13.2,
  # because it does not fail by saying so, it times out. As a separate job a
  # Hub outage is one red square on a release that is already complete and
  # signed on ghcr, and it can be re-run by itself.
  #
  # Copying the index means the same digest lands in both registries, so the
  # SLSA provenance and the SBOM come with it and one signature covers the
  # same bytes either side. Asserted below rather than assumed, the way the
  # promotion above is.
  hub:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign signs keylessly, same workflow identity as ghcr
    # No setup-buildx-action here, deliberately. `imagetools` talks to the two
    # registries directly and needs no builder, so starting one would pull the
    # buildkit image to do nothing. The runner ships the plugin itself, listed
    # as Docker-Buildx in the ubuntu image manifest.
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # ghcr serves this package publicly, so the read would work without a
      # token. Logging in anyway keeps the copy off the anonymous rate limit.
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No registry key: docker/login-action defaults to Docker Hub. The
      # account name is public, so only the token is a secret. It carries
      # Read & Write and not Delete, which is why nothing here removes a tag.
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: morgankryze
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: copy the verified digest to Docker Hub, then sign it there
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
          FLOATING: ${{ needs.image.outputs.floating }}
        run: |
          set -euo pipefail
          # The tags the release actually published, from the job that
          # published them, with the registry swapped. Nothing here decides
          # which tags a version gets, so a prerelease floats nothing here
          # for the same reason it floats nothing on ghcr: FLOATING is empty.
          refs=$(printf '%s %s' "$TAGS" "$FLOATING" | tr ' ' '\n' | grep . \
            | sed 's|^ghcr\.io/|docker.io/|')

          # Both names come out of the tag lists rather than out of
          # github.repository, which carries a capital the registries refuse.
          src=$(printf '%s\n' "$TAGS" | head -n1); src="${src%%:*}"
          dst=$(printf '%s\n' "$refs" | head -n1); dst="${dst%%:*}"

          for ref in $refs; do
            docker buildx imagetools create --tag "$ref" "${src}@${DIGEST}"
            landed=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")
            [ "$landed" = "$DIGEST" ] || {
              echo "::error::${ref} points at ${landed}, not the signed ${DIGEST}"
              exit 1
            }
          done

          # A signature is an object in the registry it is pushed to, so the
          # one made against ghcr does not exist here. Same keyless identity,
          # same digest, so SECURITY.md's command works unchanged on either
          # name, which is what the verify below is checking.
          cosign sign --yes "${dst}@${DIGEST}"

          # Given a moment. Docker Hub stores a signature as an OCI referrer
          # and indexes it asynchronously, so 1.17.2 signed cleanly, failed
          # this check four seconds later, and verified from a laptop shortly
          # after with nothing having changed. ghcr answers immediately, which
          # is why the same two lines never needed this above.
          #
          # Waiting rather than dropping the check: a signature that cannot be
          # read is exactly what this exists to catch, and the last attempt is
          # loud so a real failure says why instead of timing out in silence.
          verify() {
            cosign verify "${dst}@${DIGEST}" \
              --certificate-identity-regexp '^https://github.com/MorganKryze/cairn/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }
          for _ in 1 2 3 4 5 6; do
            verify >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::the signature pushed to ${dst} was not readable within a minute"
          verify
          exit 1

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the chart as an OCI artifact to ghcr.io
      id-token: write # cosign signs keylessly, same as the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Chart version and app version both come from the tag, so a chart
      # pulled at 1.2.3 installs cairn 1.2.3 and there is no second number to
      # remember at release time. What Chart.yaml carries in git only matters
      # to someone installing from a checkout.
      - name: package, push and sign the chart
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          ns=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]') # ghcr paths are lowercase, the owner is not
          helm package charts/cairn --version "$version" --app-version "$version"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "cairn-${version}.tgz" "oci://ghcr.io/${ns}/charts" 2>&1 | tee push.log

          # Two logins, and neither is redundant: helm writes its own credential
          # store, cosign reads the docker one. Skipping this fails at the
          # signing step, once the chart is already published.
          echo "$TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin

          # Sign the digest rather than the tag it was just pushed under: cosign
          # warns that tag input is on its way out, and a digest cannot drift.
          digest=$(awk '/^Digest: /{print $2}' push.log)
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          verify() {
            cosign verify "ghcr.io/${ns}/charts/cairn@${digest}" \
              --certificate-identity-regexp '^https://github.com/MorganKryze/cairn/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }

          # ghcr took the chart and then timed out on the signature's own blob
          # upload, three minutes in, which is cosign's default deadline: 1.19.1
          # went out installable and unsigned until this job was re-run by hand.
          # The image and the binaries, signed by the same OIDC step in the same
          # run, were fine, so it is the registry and not the code. A longer
          # deadline first, then attempts.
          #
          # The verify is the arbiter rather than cosign's exit code, and that
          # is the whole reason this is a loop and not a `--retry` flag: an
          # upload that landed and lost its answer is a success nobody was told
          # about, and signing again over it would add a second signature for
          # nothing. Asking the registry what it actually holds is the only
          # question worth asking between attempts.
          for attempt in 1 2 3; do
            cosign sign --yes --timeout 5m "ghcr.io/${ns}/charts/cairn@${digest}" || true
            verify >/dev/null 2>&1 && break
            echo "::warning::attempt ${attempt}: ghcr does not hold a readable signature for the chart yet"
            sleep 15
          done

          # The image job publishes immutable tags and only then moves `stable`
          # onto a verified digest. There is no equivalent to move here: a
          # chart is published under its version and nothing else, so the worst
          # a failure between the push and the signature can do is leave one
          # version unsigned, at a number nobody has been pointed at yet, which
          # re-running the tag republishes and signs. What is worth doing is
          # proving the signature is usable, with the command the docs give.
          #
          # Unsilenced on purpose: a run that never managed it has to fail with
          # cosign's own message, not with a bare exit code.
          verify >/dev/null
