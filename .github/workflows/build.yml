name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the badge to the orphan `badges` branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: measure and gate
        run: |
          go test -covermode=atomic -coverprofile=cov.out ./src/...
          pct=$(go tool cover -func=cov.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 70) ? 0 : 1 }' \
            || { echo "::error::coverage ${pct}% is below the 70% floor"; exit 1; }
          echo "PCT=$pct" >> "$GITHUB_ENV"
      - name: publish badge
        if: github.ref == 'refs/heads/main'
        run: bash .github/coverage-badge.sh "$PCT"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=

      # vet + tests run inside the Dockerfile, so they gate the push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f demo/compose.yaml up -d --build --wait
      - name: the pills settle green and red
        run: |
          for _ in $(seq 1 12); do
            page=$(curl -fsS http://localhost:8080/fr/)
            if echo "$page" | grep -q status-up && echo "$page" | grep -q status-down; then
              echo "pills settled"; exit 0
            fi
            sleep 5
          done
          echo "pills never settled"; docker compose -f demo/compose.yaml logs cairn; exit 1
      - if: always()
        run: docker compose -f demo/compose.yaml down
