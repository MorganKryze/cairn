name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

# Least privilege by default; the two jobs that write ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the badge to the orphan `badges` branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: measure and gate
        run: |
          go test -covermode=atomic -coverprofile=cov.out ./src/...
          pct=$(go tool cover -func=cov.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 70) ? 0 : 1 }' \
            || { echo "::error::coverage ${pct}% is below the 70% floor"; exit 1; }
          echo "PCT=$pct" >> "$GITHUB_ENV"
      - name: publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/coverage-badge.sh "$PCT"

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes ghcr.io/…:unstable, on main only
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # A pull request builds the image but never publishes it, so a fork PR
      # needs no registry credentials.
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=

      # vet + tests run inside the Dockerfile, so they gate the push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bring the demo up (retry past registry hiccups)
        run: |
          for i in 1 2 3; do
            docker compose -f demo/compose.yaml up -d --build --wait && exit 0
            echo "attempt $i failed (registry?), retrying"; sleep $((i * 10))
          done
          exit 1
      - name: the pills settle green and red
        run: |
          for _ in $(seq 1 12); do
            page=$(curl -fsS http://localhost:8080/fr/)
            if echo "$page" | grep -q status-up && echo "$page" | grep -q status-down; then
              echo "pills settled"; exit 0
            fi
            sleep 5
          done
          echo "pills never settled"; docker compose -f demo/compose.yaml logs cairn; exit 1
      - if: always()
        run: docker compose -f demo/compose.yaml down
