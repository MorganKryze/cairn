name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=

      # vet + tests run inside the Dockerfile, so they gate the push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f demo/compose.yaml up -d --build --wait
      - name: the pills settle green and red
        run: |
          for _ in $(seq 1 12); do
            page=$(curl -fsS http://localhost:8080/fr/)
            if echo "$page" | grep -q status-up && echo "$page" | grep -q status-down; then
              echo "pills settled"; exit 0
            fi
            sleep 5
          done
          echo "pills never settled"; docker compose -f demo/compose.yaml logs cairn; exit 1
      - if: always()
        run: docker compose -f demo/compose.yaml down
