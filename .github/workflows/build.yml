name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  # No paths filter here on purpose: these jobs are required checks, and a
  # required check that never runs leaves a docs-only pull request waiting
  # forever. The push trigger above keeps its filter.
  pull_request:
    branches: [main]

# Least privilege by default; the two jobs that write ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the badge to the orphan `badges` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: measure and gate
        run: |
          go test -covermode=atomic -coverpkg=./src/... -coverprofile=cov.out ./src/...
          pct=$(go tool cover -func=cov.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 87) ? 0 : 1 }' \
            || { echo "::error::coverage ${pct}% is below the 87% floor"; exit 1; }
          echo "PCT=$pct" >> "$GITHUB_ENV"
      - name: publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/coverage-badge.sh "$PCT"

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes ghcr.io/…:unstable, on main only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # A pull request builds the image but never publishes it, so a fork PR
      # needs no registry credentials.
      - if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=

      # vet + tests run inside the Dockerfile, so they gate the push.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The commit, not "unstable": with show_version on, an untagged build
          # then names the exact revision it was cut from, and links to it.
          build-args: VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Six images come from Docker Hub anonymously, sharing a rate limit
      # across the whole runner pool, so a timed-out pull is routine rather
      # than exceptional. Five tries with a flat 30s gap rides out the usual
      # outage; the job is deliberately not a required check.
      - name: bring the demo up (retry past registry hiccups)
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f demo/compose.yaml up -d --build --wait && exit 0
            echo "attempt $i failed (registry?), retrying in 30s"
            docker compose -f demo/compose.yaml down --remove-orphans >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1
      - name: the pills settle green and red
        run: |
          for _ in $(seq 1 12); do
            page=$(curl -fsS http://localhost:8080/fr/)
            if echo "$page" | grep -q status-up && echo "$page" | grep -q status-down; then
              echo "pills settled"; exit 0
            fi
            sleep 5
          done
          echo "pills never settled"; docker compose -f demo/compose.yaml logs cairn; exit 1
      - if: always()
        run: docker compose -f demo/compose.yaml down
