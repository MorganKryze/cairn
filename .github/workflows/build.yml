name: build

on:
  push:
    branches: [main]
    # Every path any job below reads, which is the only rule that keeps this
    # list honest. scripts/ and example/ were missing, and they are what the
    # `search` job serves and drives: editing a11y.mjs or the fixture skipped
    # the one job that runs them. The cost of listing them is an image rebuild
    # on a change that cannot alter the image, which is the cheaper mistake.
    paths:
      - "src/**"
      - "docker/**"
      - "demo/**"
      - "charts/**"
      - "scripts/**"
      - "example/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  # No paths filter here on purpose: these jobs are required checks, and a
  # required check that never runs leaves a docs-only pull request waiting
  # forever. The push trigger above keeps its filter.
  pull_request:
    branches: [main]

# Least privilege by default; the two jobs that write ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the badge to the orphan `badges` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: measure and gate
        run: |
          # One run, two numbers. -json is what makes the count possible, so
          # the human output is rebuilt from the same file when it fails:
          # otherwise a red build shows a wall of JSON and nothing readable.
          if ! go test -covermode=atomic -coverpkg=./src/... \
            -coverprofile=cov.out -json ./src/... > tests.json; then
            jq -r 'select(.Action == "output") | .Output' tests.json | tail -60
            exit 1
          fi
          # Subtests included, since a table case that can fail on its own is
          # a test. Deduplicated by package and name: a package tested twice
          # in one run would otherwise count twice.
          count=$(jq -r 'select(.Action == "pass" and .Test != null)
            | "\(.Package)\t\(.Test)"' tests.json | sort -u | wc -l | tr -d ' ')
          pct=$(go tool cover -func=cov.out | awk '/^total:/ {sub(/%/,"",$NF); print $NF}')
          echo "coverage: ${pct}%, tests: ${count}"
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 87) ? 0 : 1 }' \
            || { echo "::error::coverage ${pct}% is below the 87% floor"; exit 1; }
          echo "PCT=$pct" >> "$GITHUB_ENV"
          echo "TESTS=$count" >> "$GITHUB_ENV"
      - name: publish badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/badges.sh "$PCT" "$TESTS"

  # Named `search` and it stays named `search`, whatever else it grows to run:
  # this is a required check on a protected branch, and a required check under
  # a new name never runs, which leaves every pull request waiting forever for
  # a job that no longer exists.
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # search.js, the theme toggle's state, the mobile category swap, the
      # burger's scroll dismissal and the status pills catching up without a
      # reload are the behaviours the Go tests cannot reach: they assert the
      # markup that ships, not what happens once someone types, clicks, scrolls
      # or leaves a tab open. Deliberately not the demo stack, so this pulls
      # nothing from a registry and can be a required check. Same three
      # instances as `just test-browser`: example/, the fixture with more than
      # seven categories and a header burger, the one with a status page, and
      # the one whose artwork differs between the two themes, none of which
      # example/ has, and the one that guards its external links with a dialog.
      # The two lists are written twice and have to be kept in
      # step: a fixture added to the justfile alone leaves this job connecting
      # to a port nothing answers on.
      - name: drive search, accessibility and the status pills in a browser
        run: |
          npm --silent install --no-save --no-package-lock playwright
          npx --yes playwright install --with-deps --only-shell chromium
          go build -o /tmp/cairn ./src/cmd/cairn
          /tmp/cairn -config example -addr 127.0.0.1:8090 &
          /tmp/cairn -config scripts/fixtures/many-categories -addr 127.0.0.1:8091 &
          /tmp/cairn -config scripts/fixtures/status -addr 127.0.0.1:8092 &
          /tmp/cairn -config scripts/fixtures/themed -addr 127.0.0.1:8093 &
          /tmp/cairn -config scripts/fixtures/leave -addr 127.0.0.1:8094 &
          /tmp/cairn -config scripts/fixtures/states -addr 127.0.0.1:8095 &
          for port in 8090 8091 8092 8093 8094 8095; do
            for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:$port/healthz >/dev/null && break; sleep 1; done
          done
          node scripts/search.mjs http://127.0.0.1:8090/en/
          node scripts/a11y.mjs http://127.0.0.1:8090/en/ http://127.0.0.1:8091/en/ http://127.0.0.1:8092/en/ http://127.0.0.1:8093/en/ http://127.0.0.1:8094/en/ http://127.0.0.1:8095/en/
          node scripts/status.mjs http://127.0.0.1:8092/en/

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # `helm lint` reads the chart; rendering proves the templates actually
      # produce manifests. More than once, because the Ingress and the pull
      # secrets are the parts of the chart the default values never reach.
      # Same list as `just chart`.
      - name: lint and render the chart
        run: |
          helm lint charts/cairn
          helm template cairn charts/cairn >/dev/null
          helm template cairn charts/cairn \
            --set ingress.enabled=true \
            --set ingress.host=cairn.example.org \
            --set ingress.tls.enabled=true >/dev/null
          helm template cairn charts/cairn \
            --set 'imagePullSecrets[0].name=harbor' >/dev/null
          grep -qF 'kubeVersion: ">=1.19.0-0"' charts/cairn/Chart.yaml \
            || { echo "kubeVersion is the Kubernetes floor, not cairn's version: it does not move with a release"; exit 1; }

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes ghcr.io/…:unstable, on main only
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # buildx pulls its own builder image, and the default comes from Docker
      # Hub, where an anonymous pull shares one rate limit with every other
      # GitHub-hosted runner. It does not fail by saying so, it times out: this
      # step is exactly where the image job of the build on main died after
      # 1.13.2 shipped. Same mirror the base image and the demo already read
      # through, and the same object behind it, checked rather than assumed.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # Pinned like every action above. This one executes during the
          # build with the context in reach, and it was the last moving
          # tag in the chain. The digest is the same on Docker Hub and on
          # the mirror, so it does not tie us to either.
          #
          # Dependabot cannot watch an image named inside a workflow
          # (dependabot-core#5541), so a pin here would rot in silence.
          # The buildkit-pin job in security.yml is what stops that: it
          # runs weekly and says when buildx-stable-1 has moved past it.
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec # buildx-stable-1

      # A pull request builds the image but never publishes it, so a fork PR
      # needs no registry credentials.
      - if: github.event_name == 'push'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=unstable
            type=sha,prefix=

      # vet + tests run inside the Dockerfile, so they gate the push.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The commit, not "unstable": with show_version on, an untagged build
          # then names the exact revision it was cut from, and links to it.
          build-args: VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # `unstable` and the by-sha tag, on Docker Hub too, so the two registries
  # carry the same names rather than Hub holding releases alone.
  #
  # Same shape as the release's own hub job and for the same reason: it copies
  # the digest the build already pushed instead of building again, and it sits
  # outside the `image` job so it cannot fail one. That matters more here than
  # there, because `image` is a required check and a Docker Hub hiccup has no
  # business blocking a merge. This job is deliberately not a required check.
  #
  # Nothing signs `unstable` on either registry: it is whatever main is this
  # minute, not something anyone is asked to trust. Releases are signed, in
  # release.yml, on both.
  hub:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: morgankryze
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: copy the pushed digest to Docker Hub
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -euo pipefail
          refs=$(printf '%s' "$TAGS" | tr ' ' '\n' | grep . \
            | sed 's|^ghcr\.io/|docker.io/|')
          src=$(printf '%s\n' "$TAGS" | head -n1); src="${src%%:*}"
          for ref in $refs; do
            docker buildx imagetools create --tag "$ref" "${src}@${DIGEST}"
            landed=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")
            [ "$landed" = "$DIGEST" ] || {
              echo "::error::${ref} points at ${landed}, not ${DIGEST}"
              exit 1
            }
          done

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The retry outlived its own reason and kept claiming it: nothing in this
      # stack comes from Docker Hub any more, the compose file reads ghcr.io
      # and Google's mirror, and the Dockerfile it builds now does too. It
      # stays anyway. Six images and a build is a lot of registry to depend on,
      # a mirror is still a network, and five tries with a flat 30s gap costs
      # nothing on the runs where nothing goes wrong. The job is deliberately
      # not a required check.
      - name: bring the demo up (retry past registry hiccups)
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f demo/compose.yaml up -d --build --wait && exit 0
            echo "attempt $i failed (registry?), retrying in 30s"
            docker compose -f demo/compose.yaml down --remove-orphans >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1
      - name: the pills settle green and red
        run: |
          for _ in $(seq 1 12); do
            # || true or bash -e kills the step on the first failed curl,
            # which is exactly the hiccup these five tries exist to ride out.
            page=$(curl -fsS http://localhost:8080/fr/ || true)
            if echo "$page" | grep -q status-up && echo "$page" | grep -q status-down; then
              echo "pills settled"; exit 0
            fi
            sleep 5
          done
          echo "pills never settled"; docker compose -f demo/compose.yaml logs cairn; exit 1
      - if: always()
        run: docker compose -f demo/compose.yaml down
