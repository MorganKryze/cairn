name: security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
      - "docker/**"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t cairn:scan .
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: cairn:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
