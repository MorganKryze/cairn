name: security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "go.mod"
      - "go.sum"
      - "docker/**"
      - ".github/workflows/security.yml"
      - ".github/changes.sh"
  # No paths filter here on purpose: these jobs are required checks, and a
  # required check that never runs leaves a docs-only pull request waiting
  # forever. The `changes` job below skips them by `if:` instead, which
  # reports. The push trigger above keeps its filter.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # What a pull request touches, as flags; .github/changes.sh holds the
  # classification and why it is an `if:` rather than a paths filter. Any
  # other event sets every flag, so push and the schedule run what they always ran. A flag
  # reads `!= 'false'` so that if this job fails, everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.flags.outputs.go }}
      image: ${{ steps.flags.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the three-dot diff needs the merge base
      - id: flags
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash .github/changes.sh "$BASE" "$HEAD"
          else
            bash .github/changes.sh
          fi

  govulncheck:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  trivy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f docker/Dockerfile -t cairn:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cairn:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
