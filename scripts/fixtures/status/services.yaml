# Of the two monitored services, only one carries a host flag. The other is
# what proves a card foot left holding nothing draws nothing: that is the card
# of a service the status page has stopped monitoring.
- { id: alpha, url: https://alpha.example.org, name: Alpha, selfhosted: true }
- { id: bravo, url: https://bravo.example.org, name: Bravo }
# A service the monitor must never speak for, beside pills that stay unknown:
# its card carries the on-demand mark where a pill would sit, and no slot.
- { id: sleeper, url: https://sleeper.example.org, name: Sleeper, selfhosted: true, on_demand: true }
