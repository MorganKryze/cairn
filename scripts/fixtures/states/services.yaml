# The flag is on every card on purpose: it is one of the two chips that has to
# recede with a muted card, and its word is one of the four contrasts measured.
- id: plain
  url: https://plain.example.org
  name: Plain
  desc: No state at all.
  selfhosted: true
- id: beta
  url: https://beta.example.org
  name: Beta one
  desc: Rough edges.
  state: beta
  selfhosted: true
  details: |
    A decorative state keeps everything: the link, the monitoring and the pill.
    This page exists so the rule between the pill and the state has something
    to its left, which the retired one below deliberately does not.

- id: gone
  url: https://gone.example.org
  name: Gone one
  desc: Moved to the new one.
  state: retired
  selfhosted: true
  details: |
    This one moved. The detail page still works, which is the point: it is the
    only place left to say where to go instead.

# sign_in, on a name long enough to wrap on a card, which is the case the lock
# has to survive: bound to the last word, never alone on a line.
- id: vault
  url: https://vault.example.org
  name: Shared family vault for passwords and documents
  desc: Needs an account.
  sign_in: true
  selfhosted: true
  details: |
    Here so the detail page has a sign-in note to measure.

# After the others, so the first muted card on the page stays the retired one
# the contrast checks read. This one has its own state_note, the case where
# the line under the pill is the operator's and not cairn's.
- id: old
  url: https://old.example.org
  name: Old one
  desc: On its way out.
  state: deprecated
  state_note: Use the new vault instead; this one closes at the end of the year.
  selfhosted: true
  details: |
    Here so a detail page carries a note the operator wrote.

- id: soon
  name: Soon one
  desc: Not open yet.
  state: soon
  selfhosted: true
  details: |
    The second muted state, so both can be reached from one page.
