# yaml-language-server: $schema=https://raw.githubusercontent.com/MorganKryze/cairn/main/schema/site.json
title: Libre Internet
tagline:
  fr: Des outils libres, simples, pour tout le monde.
  en: Free, simple tools for everyone.
locales: [fr, en]
theme:
  accent: "#247b7b"
  # Typography: a CSS font stack for body text, or the first name of a font
  # file in the config directory's fonts/ folder (served by cairn, no external
  # request). See docs/configuration/theming.md#2-typography.
  # font:
  #   family: "Inter, system-ui, sans-serif"
  #   file: "fonts/custom-font.woff2"
footer:
  - label: { fr: Statut des services, en: Service status }
    url: https://status.example.org
pages:
  - id: hosting
    title: { fr: Comment nous hébergeons, en: How we host }
    body:
      fr: |
        Ces outils tournent sur nos machines, chez nous. Rien n'est confié à
        un tiers, et personne d'autre ne lit ce que vous y mettez.
      en: |
        These tools run on our own machines. Nothing is handed to a third
        party, and nobody else reads what you put in them.
# The flags on the cards lead here, in the language the visitor is reading.
hosting_flag:
  self: hosting
