# yaml-language-server: $schema=https://raw.githubusercontent.com/MorganKryze/cairn/main/schema/services.json
- id: pdf
  url: https://pdf.example.org
  category: documents
  icon: stirling-pdf
  name: { fr: Boîte à outils PDF, en: PDF toolbox }
  desc: { fr: "Fusionner, découper et compresser vos PDF.", en: "Merge, split and compress your PDFs." }
  details:
    fr: |
      Vous avez reçu trois PDF à signer, un scan trop lourd pour un mail, ou
      vingt pages à réunir en un seul fichier ? C'est l'outil qu'il vous faut.

      Tout se passe dans votre navigateur : déposez vos fichiers, choisissez
      une action, récupérez le résultat. Rien n'est conservé après coup.
    en: |
      Got three PDFs to sign, a scan too heavy for an email, or twenty pages
      to merge into one file? This is the tool for that.

      Drop your files, pick an action, download the result. Nothing is kept
      afterwards.
  tags: [pdf, convertir, convert]

- id: pad
  url: https://pad.example.org
  category: documents
  icon: hedgedoc
  name: { fr: Bloc-notes partagé, en: Shared notepad }
  desc: { fr: "Écrire à plusieurs, en même temps.", en: "Write together, at the same time." }
  tags: [notes, markdown]

- id: photos
  url: https://photos.example.org
  category: photos
  icon: immich
  name: { fr: Photothèque, en: Photo library }
  desc: { fr: Sauvegarder et retrouver vos photos., en: Back up and browse your photos. }
  details:
    fr: |
      Vos photos de téléphone, sauvegardées automatiquement et retrouvables
      par date, par lieu ou par visage, comme sur les grands services, mais
      chez nous.
    en: |
      Your phone photos, backed up automatically and searchable by date,
      place or face, like the big services, but hosted here.
  tags: [images, backup]

- id: music
  url: https://music.example.org
  category: audio
  icon: navidrome
  name: { fr: Musique, en: Music }
  desc: { fr: Écouter votre bibliothèque musicale partout., en: Stream your music library anywhere. }
  tags: [audio, streaming]
