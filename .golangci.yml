version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - misspell
  exclusions:
    rules:
      # locales.go is written in seven languages; misspell only knows one
      - path: locales\.go
        linters:
          - misspell
  settings:
    errcheck:
      # best-effort writes to an HTTP client or stdout, and deferred closes:
      # there is nothing useful to do when they fail
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*os.File).Write
        - (io.Closer).Close
        - io.WriteString
        - fmt.Fprintf
